<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>myCobot 280 for Arduino UNO R4</title>
  <meta name="description" content="Driving a myCobot 280 from an Arduino UNO R4 in place of the M5Stack Basic">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #0b7285; }

    /* The vue theme hardcodes 300px in four coupled rules: .sidebar width,
       .content left, and the body.close transforms. Widening the sidebar
       alone leaves the content underneath it, and leaves a strip on screen
       when the sidebar is toggled shut. Override them together, and only
       above the theme's 768px breakpoint so mobile keeps its own layout. */
    @media screen and (min-width: 769px) {
      .sidebar            { width: 330px; }
      .content            { left: 330px; }
      body.close .sidebar { transform: translateX(-330px); }
      body.close .content { left: 0; }
    }

    .markdown-section { max-width: 900px; }
    .markdown-section h1 { padding-top: 1.2rem; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section img { border: 1px solid #e3e3e3; border-radius: 3px; }
    .markdown-section pre > code { font-size: 0.86rem; }
    .sidebar ul li a { font-size: 14px; }
    .app-name-link img { max-width: 100%; }
    /* upstream pages mix raw HTML tables and images; keep them inside the column */
    .markdown-section > * { max-width: 100%; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'myCobot 280<br><small>for Arduino UNO R4</small>',
      repo: 'https://github.com/vhp8rc7p/myCobot_280_for_UNO_R4_en',
      loadSidebar: '_sidebar.md',
      // 0 = do not inject the current page's own headings into the sidebar.
      // With subMaxLevel > 0 docsify appends every heading of the open page
      // under its sidebar entry, so opening "4. First Time Installation"
      // pushed "Product Standard List" and friends in below 4.5.
      subMaxLevel: 0,
      maxLevel: 4,
      auto2top: true,
      // Needed so image paths inside pages ("../../resource/...") resolve
      // against the page's own folder. It also makes docsify resolve SIDEBAR
      // links that way, which doubles them - so every link in _sidebar.md is
      // written root-absolute ("/1-Product...") to opt out of that.
      relativePath: true,
      // With relativePath on, docsify looks for _sidebar.md in each folder.
      // Serve the single root one for every path instead of 404ing.
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the book',
        noData: 'No results',
        depth: 4
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
